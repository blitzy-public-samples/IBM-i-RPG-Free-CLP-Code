# Server block of the Compose `frontend` service: serves the built SPA and
# reverse-proxies /api/ to the API, so the browser talks to one origin only.
# frontend/Dockerfile copies it to /etc/nginx/conf.d/default.conf of
# nginx:1.30.5-alpine, whose nginx.conf includes it in its `http` block, so it
# holds only a log format, maps, one request-rate zone and one server; events,
# MIME types and workers stay as the image ships them.
#
# Deliberately absent: authentication (the API owns HTTP Basic and the roles,
# and `Authorization` passes untouched), CORS (one origin), and caching or
# compression beyond the image defaults.

# Access-log format of every request, those nginx logs before choosing a
# location included, which would otherwise get the image's `main` format. It
# logs client address, time, method, path, status, body size, timings and the
# upstream (`-` when nginx answered itself), and leaves out the query string
# (the name and city filters, and the paging cursor, which encodes a
# customer's name, city, state and id), the Basic username, the referrer, the
# User-Agent and X-Forwarded-For. Method and path are those the client sent
# (the maps below), so an SPA fallback or an error page logs as the request
# made.
#
# $request_path_no_query: the raw $request_uri up to its first `?`; empty when
# nginx could not parse the request line.
map $request_uri $request_path_no_query {
    ~^(?<request_path>[^?]*) $request_path;
}

# $request_line_method: the method of the raw request line, $request.
# $request_method cannot serve: error_page turns a rejected request into a GET
# of its page. Only a first word of upper-case letters, `_` and `-` ended by a
# space is taken, otherwise `-`, so no part of a malformed line, which may hold
# a query, is logged.
map $request $request_line_method {
    default "-";
    "~^([A-Z_-]+) " $1;
}

# $access_loggable: "0", which access_log's `if=` skips, for exactly the
# second request of the Compose healthcheck, a GET of / from 127.0.0.1 that
# nginx answered 200, and "1" for every other request. 127.0.0.1 is the
# container's own loopback, reachable only from inside it: published-port
# traffic arrives from the Docker network's gateway, other containers from
# their own addresses, and nothing here rewrites $remote_addr, so no request
# from outside is ever skipped. A probe answered anything but 200 stays
# logged for diagnosis, and so does any other loopback request (another path,
# a query, another method).
map "$remote_addr $request_line_method $request_uri $status" $access_loggable {
    "127.0.0.1 GET / 200" 0;
    default 1;
}

# $api_problem_instance: the `instance` member, with its trailing comma, of
# nginx's own problem bodies, or "" to leave it out. It is set only for a path
# under /api/ made of characters a URI path allows as they are (letters,
# digits, - . _ ~ ! $ & ' ( ) * + , ; = : @ / and % with two hex digits), which
# needs no JSON escaping and equals ProblemFactory's `instance`, Tomcat's
# getRequestURI(). Any other path (a `"`, `\`, space, control or non-ASCII
# byte, or a stray %) is left out, since nginx cannot quote it.
map $request_path_no_query $api_problem_instance {
    default "";
    "~^/api/(?:[-A-Za-z0-9._~!$&'()*+,;=:@/]|%[0-9A-Fa-f]{2})*\z" '"instance":"$request_path_no_query",';
}

# $api_request: "1" when the request target, as sent, lies under /api/; only
# then do the rejection pages answer problem+json. It reads the raw $request:
# nginx rejects most such requests before it has a decoded URI, after
# error_page $uri names the page, and $request exists even for a line nginx
# could not parse or cut short. The target is origin form (/api/...) or
# absolute form (scheme://authority/api/...), so /api, /apix/, /API/ and an
# encoded /%61pi/ are not API requests and keep nginx's own page.
map $request $api_request {
    default "";
    "~^[^ ]* +(?:[A-Za-z][-A-Za-z0-9+.]*://[^/?# ]*)?/api/" 1;
}

# Browser security headers of the API's answers (location /api/): each map
# yields the server block's literal value when the API did not send the header
# and "" otherwise, for which add_header adds nothing, so an API header is
# never replaced or duplicated.
map $upstream_http_content_security_policy $security_csp {
    "" "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";
    default "";
}

map $upstream_http_x_content_type_options $security_nosniff {
    "" "nosniff";
    default "";
}

map $upstream_http_x_frame_options $security_frame_options {
    "" "DENY";
    default "";
}

map $upstream_http_referrer_policy $security_referrer_policy {
    "" "no-referrer";
    default "";
}

# Throttle of credentialed API requests (limit_req in location /api/). The
# API keeps no per-caller state between requests, so it counts no failed
# sign-ins and locks out no user or client, and only logs each rejected one
# at WARN; this gateway, the only browser ingress, limits instead how fast
# one client may send credentials, wrong ones included. The API port is
# bound to loopback by default and is not throttled, and k6 calls app:8080
# directly, so neither passes through here.
#
# $api_credentials_client: the throttle's key, the client address
# ($binary_remote_addr, the peer of the connection, never a header a client
# could forge such as X-Forwarded-For) of a request that carries an
# Authorization header, and "" for any other request. limit_req counts no
# request whose key is empty, so anonymous requests, the public GET
# /api/messages the SPA sends before sign-in included, are never throttled.
# In Compose every host client reaches the published port from the Docker
# network's gateway address, so all of them share one bucket; another
# container has its own.
map $http_authorization $api_credentials_client {
    "" "";
    default $binary_remote_addr;
}

# 10 credentialed requests per second per client, the bucket's steady rate,
# well above what one SPA user sends; 1 MB holds about 16,000 client states,
# and when it is full nginx drops the least recently used one.
limit_req_zone $api_credentials_client zone=api_credentials:1m rate=10r/s;

# $api_retry_after: the Retry-After value of the throttle's 429, "1" (after
# one second the bucket has drained 10 requests, so a retry is admitted), and
# "" for any other status, for which add_header adds nothing.
map $status $api_retry_after {
    429 1;
    default "";
}

log_format redacted '$remote_addr [$time_local] '
                    '"$request_line_method $request_path_no_query $server_protocol" '
                    '$status $body_bytes_sent '
                    'request_time=$request_time '
                    'upstream_addr=$upstream_addr '
                    'upstream_status=$upstream_status '
                    'upstream_connect_time=$upstream_connect_time '
                    'upstream_header_time=$upstream_header_time '
                    'upstream_response_time=$upstream_response_time';

server {
    # IPv4 only: the healthcheck targets 127.0.0.1 and host port mappings
    # arrive over IPv4, while `listen [::]:80` stops nginx on a host without
    # IPv6 (the image's entrypoint does not add it to a replaced default.conf).
    listen 80;
    server_name _;

    # No nginx version in the Server header or error pages.
    server_tokens off;

    # nginx's own redirects (/api -> /api/) get a relative Location; an
    # absolute one would name container port 80, not the published
    # FRONTEND_PORT.
    absolute_redirect off;

    # frontend/Dockerfile copies Vite's dist/ here.
    root /usr/share/nginx/html;
    index index.html;

    # Inherited by every location; only /healthz turns it off, and
    # $access_loggable (above) skips the healthcheck's GET of /.
    access_log /var/log/nginx/access.log redacted if=$access_loggable;

    # Browser security headers of every response nginx writes itself, error
    # statuses included (`always`). The values are literal: nginx's own
    # answers, a 502 or 504 after an upstream sent part of its headers
    # included, must not depend on what a failed upstream sent. Like
    # error_page, add_header is inherited only by a level that sets none;
    # only location /api/ sets its own. The CSP fits the SPA: only its own
    # /assets/ scripts and styles, no inline script or style, a data: favicon,
    # fetches to /api/ only. X-Frame-Options backs up frame-ancestors for
    # browsers without CSP. No HSTS: this listener is plain HTTP.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Retry-After: 1 on the throttle's 429 only ($api_retry_after, above). The
    # 429 is answered by its rejection page, which inherits this level's
    # add_header as the other pages do; for every other status the value is
    # empty and no header is added.
    add_header Retry-After $api_retry_after always;

    # nginx's own rejections, by the status it gives them: 400 (a malformed
    # request line, URI, header or chunked body), 494 (a header beyond nginx's
    # buffers, sent as 400), 405 (TRACE, CONNECT), 413 (a body over 1 MB), 414
    # (a request line over 8 KB), 429 (a credentialed API request beyond the
    # throttle's burst), 501 (an unknown Transfer-Encoding) and 505 (an HTTP
    # major version above 1). Most happen before a location is chosen, so they
    # are routed here; a level that sets any error_page inherits none, so
    # `location /api/` repeats the list. Only `location /api/` throttles, but
    # 429 stays in both lists, so they are the same. The pages are URIs, not
    # named locations: a named location cannot take a request whose line
    # failed to parse (500 "empty URI in redirect to named location"). No 408:
    # nginx closes a timed-out connection without an answer.
    error_page 400 /_nginx/rejection/400;
    error_page 494 /_nginx/rejection/494;
    error_page 405 /_nginx/rejection/405;
    error_page 413 /_nginx/rejection/413;
    error_page 414 /_nginx/rejection/414;
    error_page 429 /_nginx/rejection/429;
    error_page 501 /_nginx/rejection/501;
    error_page 505 /_nginx/rejection/505;

    # Compose healthcheck probe (its second request, to /, proves index.html is
    # served). Not logged, as it runs every 5 seconds: access_log is off here,
    # and $access_loggable skips its GET of / unless that fails.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # The API: Compose service `app`, container port 8080 (backend/Dockerfile).
    # $api_upstream carries no URI part, so the request URI is forwarded
    # exactly as sent, with no prefix stripped and no re-encoding of filter
    # values.
    #
    # DNS refresh: a variable proxy_pass makes nginx resolve `app` per request
    # through Docker's embedded DNS server, so a recreated `app` with a new
    # address is reached once the cached answer expires, with no restart of
    # nginx. valid=10s caps that cache (Docker's TTL is 600 s); ipv6=off, as
    # the network is IPv4 only. Until then a request may go to a vanished
    # address: proxy_connect_timeout ends that connect after 5 s (default 60 s)
    # with nginx's 504. `app` stopped, refusing or unresolvable gets 502 at
    # once.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        set $api_upstream http://app:8080;
        proxy_pass $api_upstream;
        proxy_connect_timeout 5s;
        proxy_http_version 1.1;

        # A search or get that meets a generator load waits behind the load's
        # ACCESS EXCLUSIVE lock (repository.LockWaitingReads), and the API sends
        # nothing until the load commits. At the Compose load's 17.0 s per
        # 1,000,000 rows (docs/performance/search-benchmark.md, section 6), the
        # largest load the 4-character id space allows, 1,679,616 rows, holds
        # the lock about 29 s, and 300 s (default 60 s) is about ten times that:
        # the UI normally gets the API's own answer, and a longer wait gets
        # nginx's 504.
        proxy_read_timeout 300s;

        # Throttle (zone api_credentials, above): only requests that carry
        # an Authorization header count. Beyond 10 per second from one
        # client, a burst of 20 more is admitted: the first 10 at once, so the
        # few parallel calls of one SPA screen are never slowed, the next 10
        # delayed to the rate, and any beyond the burst rejected with 429
        # (limit_req_status; nginx's default is 503), which the list below
        # routes to its rejection page, with Retry-After: 1. Delaying rather
        # than rejecting within the burst means a client that waits for each
        # answer before sending the next, the SPA or a sequential guesser,
        # is slowed to 10 per second and never refused, while a parallel
        # flood is refused. Rejections and delays are not in the error log,
        # which is discarded here; the access log shows each 429 with no
        # upstream_addr.
        limit_req zone=api_credentials burst=20 delay=10;
        limit_req_status 429;

        # Other request headers pass unchanged, `Authorization` and
        # `X-Requested-With` included: the API authenticates with them and
        # decides by them whether a 401 carries a `WWW-Authenticate` challenge.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Deliberately absent: proxy_hide_header, proxy_intercept_errors and
        # proxy_cache. The API's status, headers and bodies, its problem+json
        # errors included, pass unchanged; nginx substitutes only Date and
        # Server and adds the security headers the API did not send (the maps
        # above). Setting add_header here drops the server's, so all four are
        # repeated; nginx's /api -> /api/ redirect, answered at this level with
        # no upstream, gets all four. nginx's own 502, 504 and rejections leave
        # this level through error_page and get the server's.
        add_header Content-Security-Policy $security_csp always;
        add_header X-Content-Type-Options $security_nosniff always;
        add_header X-Frame-Options $security_frame_options always;
        add_header Referrer-Policy $security_referrer_policy always;

        # 502 and 504 that nginx generates itself, when no API answer exists,
        # get the problem+json of the named locations below; the API's own 502
        # APP0502 is not intercepted.
        error_page 502 @api_bad_gateway;
        error_page 504 @api_gateway_timeout;

        # The server's rejection pages, repeated (see there). Here nginx
        # rejects only bodies (a malformed chunked body, a body over 1 MB) and
        # requests beyond the throttle's burst (429), but the full list keeps
        # every rejection routed as at server level.
        error_page 400 /_nginx/rejection/400;
        error_page 494 /_nginx/rejection/494;
        error_page 405 /_nginx/rejection/405;
        error_page 413 /_nginx/rejection/413;
        error_page 414 /_nginx/rejection/414;
        error_page 429 /_nginx/rejection/429;
        error_page 501 /_nginx/rejection/501;
        error_page 505 /_nginx/rejection/505;

        # Redaction: the error log of API requests is discarded at every level,
        # because nginx appends the raw request line and, where there is one,
        # the upstream URL with its query and the referrer to every per-request
        # message, and no directive redacts them. An upstream or host failure
        # still shows in the access line as a 5xx with upstream_addr,
        # upstream_status and timings. Faults outside a request, such as
        # accept() failing when descriptors run out, stay in the image's error
        # log.
        error_log /dev/null;
    }

    # nginx's 502 and 504 under /api/, for which no API answer exists. Each
    # body is the one ProblemFactory builds for DEM9999 at that status, with
    # the same members in the same order, so the UI presents it as any API
    # problem: `title` is the reason phrase, `detail` the DEM9999 text copied
    # verbatim from
    # backend/customer-api/src/main/resources/messages/messages.properties,
    # which must change whenever that text does, `args` empty, and `instance`
    # from $api_problem_instance; nothing else from the request is echoed.
    # NginxGatewayProblemTest (customer-api tests) compares both with
    # ProblemFactory's output. The empty `types` keeps a file extension
    # (/api/x.html) from choosing another Content-Type, and the error log is
    # discarded as for every API request.
    location @api_bad_gateway {
        error_log /dev/null;
        types { }
        default_type application/problem+json;
        return 502 '{"type":"urn:customer-master:problem:DEM9999","title":"Bad Gateway","status":502,"detail":"Program Error! Please contact IT now.",$api_problem_instance"code":"DEM9999","args":[]}';
    }

    location @api_gateway_timeout {
        error_log /dev/null;
        types { }
        default_type application/problem+json;
        return 504 '{"type":"urn:customer-master:problem:DEM9999","title":"Gateway Timeout","status":504,"detail":"Program Error! Please contact IT now.",$api_problem_instance"code":"DEM9999","args":[]}';
    }

    # The rejection pages (error_page above). /_nginx/ is reserved for them,
    # and `internal` answers 404 to a client asking for one. A request under
    # /api/ ($api_request) gets the API's body for the status nginx sends (494
    # as 400): for a 4xx, ProblemErrorController's APP0400 with the lower-case
    # reason phrase as its argument, as for a request Tomcat's connector
    # rejects; for 501 and 505, DEM9999 as in the gateway bodies. `title` is
    # Spring's reason phrase (413 Payload Too Large, 505 HTTP Version not
    # supported), `detail` is copied verbatim from messages.properties as
    # above and must change with it, `instance` comes from
    # $api_problem_instance, and there is no errorId, which the API adds only
    # to a 500. NginxGatewayProblemTest compares every body with
    # ProblemFactory's output. Any other request gets nginx's built-in HTML
    # page: the `if` returns the bare status, and a request already on an
    # error page gets the built-in page (for 494, "400 Request Header Or
    # Cookie Too Large"). `types` is empty as in the gateway locations, and the
    # error log is discarded, since the request line may be an API request's.
    # Every page inherits the server's add_header, so the 429 page also sends
    # Retry-After: 1.
    location = /_nginx/rejection/400 {
        internal;
        error_log /dev/null;
        types { }
        default_type application/problem+json;
        if ($api_request = "") {
            return 400;
        }
        return 400 '{"type":"urn:customer-master:problem:APP0400","title":"Bad Request","status":400,"detail":"Request is not valid: bad request",$api_problem_instance"code":"APP0400","args":["bad request"]}';
    }

    location = /_nginx/rejection/494 {
        internal;
        error_log /dev/null;
        types { }
        default_type application/problem+json;
        if ($api_request = "") {
            return 494;
        }
        return 400 '{"type":"urn:customer-master:problem:APP0400","title":"Bad Request","status":400,"detail":"Request is not valid: bad request",$api_problem_instance"code":"APP0400","args":["bad request"]}';
    }

    location = /_nginx/rejection/405 {
        internal;
        error_log /dev/null;
        types { }
        default_type application/problem+json;
        if ($api_request = "") {
            return 405;
        }
        return 405 '{"type":"urn:customer-master:problem:APP0400","title":"Method Not Allowed","status":405,"detail":"Request is not valid: method not allowed",$api_problem_instance"code":"APP0400","args":["method not allowed"]}';
    }

    location = /_nginx/rejection/413 {
        internal;
        error_log /dev/null;
        types { }
        default_type application/problem+json;
        if ($api_request = "") {
            return 413;
        }
        return 413 '{"type":"urn:customer-master:problem:APP0400","title":"Payload Too Large","status":413,"detail":"Request is not valid: payload too large",$api_problem_instance"code":"APP0400","args":["payload too large"]}';
    }

    location = /_nginx/rejection/414 {
        internal;
        error_log /dev/null;
        types { }
        default_type application/problem+json;
        if ($api_request = "") {
            return 414;
        }
        return 414 '{"type":"urn:customer-master:problem:APP0400","title":"URI Too Long","status":414,"detail":"Request is not valid: uri too long",$api_problem_instance"code":"APP0400","args":["uri too long"]}';
    }

    location = /_nginx/rejection/429 {
        internal;
        error_log /dev/null;
        types { }
        default_type application/problem+json;
        if ($api_request = "") {
            return 429;
        }
        return 429 '{"type":"urn:customer-master:problem:APP0400","title":"Too Many Requests","status":429,"detail":"Request is not valid: too many requests",$api_problem_instance"code":"APP0400","args":["too many requests"]}';
    }

    location = /_nginx/rejection/501 {
        internal;
        error_log /dev/null;
        types { }
        default_type application/problem+json;
        if ($api_request = "") {
            return 501;
        }
        return 501 '{"type":"urn:customer-master:problem:DEM9999","title":"Not Implemented","status":501,"detail":"Program Error! Please contact IT now.",$api_problem_instance"code":"DEM9999","args":[]}';
    }

    location = /_nginx/rejection/505 {
        internal;
        error_log /dev/null;
        types { }
        default_type application/problem+json;
        if ($api_request = "") {
            return 505;
        }
        return 505 '{"type":"urn:customer-master:problem:DEM9999","title":"HTTP Version not supported","status":505,"detail":"Program Error! Please contact IT now.",$api_problem_instance"code":"DEM9999","args":[]}';
    }

    # SPA: an existing file is served as is, any other path gets index.html, so
    # client routes (/sign-in, /customers, /demo/selection) load on a deep link
    # or a refresh.
    location / {
        try_files $uri /index.html;
    }
}
