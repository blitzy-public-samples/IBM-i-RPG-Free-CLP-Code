# Server block of the Compose `frontend` service: serves the built SPA and
# reverse-proxies the API, so the browser talks to one origin only.
#
# frontend/Dockerfile copies this file to /etc/nginx/conf.d/default.conf in
# nginx:1.30.5-alpine, replacing the image's default server. The image's
# nginx.conf includes it inside its `http` block, so it holds one log format,
# the maps it uses and one server block, not a full nginx.conf: `events`,
# `http`, MIME types and worker settings stay as the image ships them. This
# server writes its access log in the redacted format below and keeps the
# image's error log, except that the error log of requests under /api/, and of
# every request nginx answers from its rejection pages, is discarded (see
# `location /api/` and the rejection pages).
#
# What this server does not do, on purpose:
#   - Authenticate. The API owns HTTP Basic authentication and the INQUIRY /
#     MAINTENANCE roles; nginx forwards `Authorization` untouched and has no
#     auth_basic.
#   - Answer cross-origin requests. The SPA and the API share this origin, so
#     there are no CORS headers here or in the backend.
#   - Rewrite API responses. Status, headers (including `WWW-Authenticate`) and
#     `application/problem+json` bodies reach src/api/client.ts as the API sent
#     them. nginx answers a request under /api/ itself only when no answer
#     comes from the API (502, 504) or when it rejects the request before it
#     could forward it (a malformed or oversized request line, header or body,
#     TRACE, an unknown transfer coding or HTTP version), and then with
#     `application/problem+json` too. Any other request nginx rejects keeps
#     nginx's own HTML page.
#   - Cache or compress beyond the image defaults.

# Access-log format for every request this server logs, including those nginx
# logs before choosing a location, such as a client that disconnects
# mid-headers or sends an oversized header. Those would otherwise land in the
# image's `main` format, so an API request failing that early would be logged
# with its query and Basic username. Fields: client address, time, method,
# path, status, body size and timings, plus the upstream that answered (`-`
# for a request nginx answers itself). It leaves out what `main` adds about
# the caller and the query: the query string (customer name and city filters,
# and the paging cursor, which encodes a customer's name, city, state and id),
# the Basic username, the referrer, the User-Agent and X-Forwarded-For. The
# method and the path are the ones the client sent, the path cut at the query
# (see the maps below), so an SPA route served by the index.html fallback logs
# as the route the client asked for, and a request answered from an error
# page logs as the request the client made; the only data an API path carries
# is a customer id.
#
# $request_path_no_query: $request_uri, raw and undecoded as the client sent
# it, up to its first `?`. The pattern matches any string, so a request whose
# line nginx could not parse, and that has no $request_uri, logs an empty path.
map $request_uri $request_path_no_query {
    ~^(?<request_path>[^?]*) $request_path;
}

# $request_line_method: the method as the client sent it, read from $request,
# the raw request line. $request_method cannot serve here: error_page turns a
# rejected request into a GET of its error page, so a rejected TRACE or POST
# would log as GET. For every request nginx serves or forwards, the two are
# equal. The pattern takes only a first word made of the characters nginx
# accepts in a method (upper-case letters, `_` and `-`) and ended by a space;
# any other line, such as a lower-case method or no space after the method,
# logs `-`, so no part of a malformed line, which may hold a query, reaches
# the log.
map $request $request_line_method {
    default "-";
    "~^([A-Z_-]+) " $1;
}

# $api_problem_instance: the `instance` member, with its trailing comma, of
# nginx's own problem bodies (the gateway named locations and rejection pages
# at the end of the server block), or "", which leaves the member out. It is
# set only for a path under /api/ made solely of characters a URI path allows
# as they are: letters, digits, - . _ ~ ! $ & ' ( ) * + , ; = : @ / and %
# followed by two hex digits. Such a path needs no escaping in a JSON string
# and is exactly what ProblemFactory puts in `instance`: the raw request URI
# up to its query, as Tomcat's getRequestURI() returns it. Any other path (one
# holding a `"`, a `\`, a space, a control or non-ASCII byte, or a stray %) is
# left out: the API would quote it, but nginx cannot, and it must not break
# the JSON.
map $request_path_no_query $api_problem_instance {
    default "";
    "~^/api/(?:[-A-Za-z0-9._~!$&'()*+,;=:@/]|%[0-9A-Fa-f]{2})*\z" '"instance":"$request_path_no_query",';
}

# $api_request: "1" when the request target, as the client sent it, lies under
# /api/, and "" otherwise. The rejection pages at the end of the server block
# answer problem+json only when it is "1". It reads $request, the raw request
# line, because nginx rejects most such requests before it has a decoded URI
# to choose a location by, and once error_page has moved a request to its
# page, $uri names the page. $request is set even for a line nginx could not
# parse or cut short (a request line over 8 KB). The target is the text after
# the method and its spaces: a path (origin form, `GET /api/customers
# HTTP/1.1`), or a scheme, `://`, an authority and a path (absolute form, `GET
# http://host/api/customers HTTP/1.1`). The path must begin with /api/ as
# sent, the rule $api_problem_instance applies, so /api, /apix/, /API/ and an
# encoded /%61pi/ are not API requests and keep nginx's own page.
map $request $api_request {
    default "";
    "~^[^ ]* +(?:[A-Za-z][-A-Za-z0-9+.]*://[^/?# ]*)?/api/" 1;
}

log_format redacted '$remote_addr [$time_local] '
                    '"$request_line_method $request_path_no_query $server_protocol" '
                    '$status $body_bytes_sent '
                    'request_time=$request_time '
                    'upstream_addr=$upstream_addr '
                    'upstream_status=$upstream_status '
                    'upstream_connect_time=$upstream_connect_time '
                    'upstream_header_time=$upstream_header_time '
                    'upstream_response_time=$upstream_response_time';

server {
    # IPv4 only. The Compose healthcheck targets 127.0.0.1, and host port
    # mappings reach the container over IPv4. No `listen [::]:80`: nginx fails
    # to start on a host with IPv6 disabled, and the image's entrypoint script
    # that adds it does not touch a replaced default.conf.
    listen 80;
    server_name _;

    # Keep the nginx version out of the Server header and error pages.
    server_tokens off;

    # Redirects nginx itself issues (`/api` -> `/api/`) carry a relative
    # Location. An absolute one would name the container port 80 instead of the
    # host port Compose publishes (FRONTEND_PORT). API responses are unaffected.
    absolute_redirect off;

    # frontend/Dockerfile copies Vite's dist/ here.
    root /usr/share/nginx/html;
    index index.html;

    # Replaces the image's `main` access log for every request to this server:
    # API and SPA requests alike, and requests that fail before a location is
    # chosen. Locations inherit it; only /healthz turns it off.
    access_log /var/log/nginx/access.log redacted;

    # nginx's own rejections of a request it will not serve or forward, by the
    # status nginx gives them: 400 (a malformed request line, URI, header or
    # chunked body, such as an invalid % escape, an encoded NUL, a path above
    # the root, a lower-case method, or a missing or repeated Host), 494 (a
    # header line over 8 KB or headers beyond nginx's buffers, sent as 400),
    # 405 (TRACE, CONNECT), 413 (a body over client_max_body_size, 1 MB by
    # default), 414 (a request line over 8 KB), 501 (an unknown
    # Transfer-Encoding) and 505 (an HTTP major version above 1). Most happen
    # before nginx has chosen a location, so they are routed at server level;
    # `location /` inherits the list, and `location /api/` repeats it, because
    # a level that sets any error_page inherits none. Each status goes to its
    # own page (the internal locations under /_nginx/rejection/ at the end of
    # the server block), which answers problem+json for a request under /api/
    # and nginx's own HTML page for any other. The pages are URIs, not named
    # locations: a named location cannot take a request whose request line
    # failed to parse (nginx answers 500 "empty URI in redirect to named
    # location"), while a URI takes it at every stage. No 408: nginx closes a
    # connection that times out without sending an answer.
    error_page 400 /_nginx/rejection/400;
    error_page 494 /_nginx/rejection/494;
    error_page 405 /_nginx/rejection/405;
    error_page 413 /_nginx/rejection/413;
    error_page 414 /_nginx/rejection/414;
    error_page 501 /_nginx/rejection/501;
    error_page 505 /_nginx/rejection/505;

    # Liveness probe of the Compose healthcheck:
    #   wget -q -O /dev/null http://127.0.0.1/healthz && wget -q -O /dev/null http://127.0.0.1/
    # This location proves nginx answers; the second request proves the built
    # index.html is served. Not logged, because it runs every 5 seconds.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # The API. `app` is the backend's Compose service name and 8080 its
    # container port (backend/Dockerfile EXPOSE 8080); host ports are Compose's
    # business and never appear here.
    #
    # proxy_pass carries no URI part and no trailing slash, so the request URI is
    # forwarded exactly as the client sent it: /api/customers?name=AB%25&size=12
    # reaches Spring as /api/customers?name=AB%25&size=12, with no prefix
    # stripped and no re-encoding of the filter values. The upstream is held in
    # $api_upstream, which carries no URI part either, so this stays true.
    #
    # `app` is looked up when requests arrive, not once at startup: a proxy_pass
    # given through a variable makes nginx ask the resolver below, Docker's
    # embedded DNS server, present on every Compose network. When Compose
    # recreates `app` (a rebuild or a changed setting) its new container gets a
    # new address, and requests reach it as soon as the cached answer expires,
    # with no restart of this service. valid=10s caps that cache, which would
    # otherwise follow Docker's 600 s TTL; ipv6=off because the Compose network
    # carries IPv4 only. Until the cached answer expires, a request can still go
    # to the address of a container that is gone, where nothing answers the
    # connect: proxy_connect_timeout ends that wait after 5 s instead of nginx's
    # default 60 s, far above the sub-millisecond connect to a live `app` on the
    # same network, and nginx answers it 504. A request made while `app` is
    # stopped, refuses connections or is unknown to the DNS server gets nginx's
    # 502 at once (the error pages below).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        set $api_upstream http://app:8080;
        proxy_pass $api_upstream;
        proxy_connect_timeout 5s;
        proxy_http_version 1.1;

        # How long nginx waits for the API's answer (nginx's default is 60 s). A
        # search or get that meets a generator load waits behind the load's
        # ACCESS EXCLUSIVE lock until the load commits, re-checking it every
        # DB_LOCK_TIMEOUT (repository.LockWaitingReads), and the API sends
        # nothing until then. The Compose load of 1,000,000 rows took 16.8 s,
        # generation and ANALYZE included (docs/performance/search-benchmark.md),
        # so the largest load the 4-character id space allows, 1,679,616 rows,
        # holds the lock about 28 s at that rate; 300 s leaves about ten times
        # that for a slower host, and the UI receives the API's own answer.
        # Nothing else comes near it: an add or update ends at 409 DEM1001 after
        # the lock timeout, and an address review within the USPS client's 5 s
        # connect and 10 s read timeouts. A wait that still outlasts 300 s gets
        # nginx's own 504 below.
        proxy_read_timeout 300s;

        # Request headers not set below pass through unchanged. That includes
        # `Authorization: Basic ...` and `X-Requested-With: XMLHttpRequest`,
        # which the API reads to authenticate the caller and to decide whether
        # to send a `WWW-Authenticate` challenge on 401.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Deliberately absent: proxy_hide_header, proxy_intercept_errors,
        # proxy_cache and add_header. Error responses the API sends (401, 403,
        # 404, 409, 422, 500, 502, 503) keep the API's problem+json body, and
        # the API's response headers come back unchanged; nginx substitutes only
        # its own Date and Server, as every proxied response gets by default.

        # nginx's own errors, when no answer comes from the API: 502 while `app`
        # is stopped, refuses connections or cannot be resolved, 504 when the
        # connect or the answer outlasts its timeout above. Each becomes the
        # problem+json of the named locations below instead of nginx's HTML
        # page. With proxy_intercept_errors off, error_page applies only to
        # errors nginx generates itself, never to a response the API sent, its
        # own 502 APP0502 included.
        error_page 502 @api_bad_gateway;
        error_page 504 @api_gateway_timeout;

        # The rejection pages of the server level, repeated here because this
        # level sets error pages of its own and so inherits none. Under /api/
        # nginx itself rejects only the request body (400 for a malformed
        # chunked body, 413 above client_max_body_size); the full list keeps
        # every rejection routed exactly as at server level.
        error_page 400 /_nginx/rejection/400;
        error_page 494 /_nginx/rejection/494;
        error_page 405 /_nginx/rejection/405;
        error_page 413 /_nginx/rejection/413;
        error_page 414 /_nginx/rejection/414;
        error_page 501 /_nginx/rejection/501;
        error_page 505 /_nginx/rejection/505;

        # Logging. The access line comes from the server-level access_log
        # above. The error log of API requests is discarded at every level:
        # nginx appends the raw request line and, where there is one, the
        # upstream URL with its query and the referrer to every per-request
        # message, and no directive redacts them. That covers error, warn and
        # notice messages from upstream or client failures, and crit, alert and
        # emerg ones from host faults such as descriptor or disk exhaustion. An
        # upstream or host failure on an API request still shows in its access
        # line as a 5xx, with upstream_addr, upstream_status and the timings of
        # any upstream attempt. Faults outside a request's context, such as
        # accept() failing when descriptors run out, stay in the image's error
        # log.
        error_log /dev/null;
    }

    # The answers to nginx's own 502 and 504 under /api/ (error_page above).
    # With the rejection pages below, they are the only error bodies under
    # /api/ that ProblemFactory does not build. For these two, no API answer
    # exists for nginx to forward: `app` is unreachable, or its answer did not
    # come within the 300 s cutoff. Each is the body ProblemFactory builds for
    # program-error code DEM9999 at that status, with the same members in the
    # same order, so the UI presents it as it presents any API problem;
    # NginxGatewayProblemTest (customer-api tests) compares both with
    # ProblemFactory's output. `title` is the status's reason phrase. `detail`
    # is the DEM9999 text copied verbatim from
    # backend/customer-api/src/main/resources/messages/messages.properties, and
    # must change whenever that text does. `args` is empty, as DEM9999 takes
    # none. `instance` comes from $api_problem_instance (the map at the top of
    # this file), which follows ProblemFactory's rule: the request path, or no
    # member when the path is not usable as it is. Nothing else from the
    # request is echoed. The empty `types` keeps a request's file extension
    # (/api/x.html) from choosing another Content-Type, and the error log stays
    # discarded as for every API request.
    location @api_bad_gateway {
        error_log /dev/null;
        types { }
        default_type application/problem+json;
        return 502 '{"type":"urn:customer-master:problem:DEM9999","title":"Bad Gateway","status":502,"detail":"Program Error! Please contact IT now.",$api_problem_instance"code":"DEM9999","args":[]}';
    }

    location @api_gateway_timeout {
        error_log /dev/null;
        types { }
        default_type application/problem+json;
        return 504 '{"type":"urn:customer-master:problem:DEM9999","title":"Gateway Timeout","status":504,"detail":"Program Error! Please contact IT now.",$api_problem_instance"code":"DEM9999","args":[]}';
    }

    # The rejection pages, one per status nginx rejects a request with
    # (error_page at server level and in `location /api/`). /_nginx/ is
    # reserved for them; no SPA route uses it, and `internal` answers 404 to a
    # client that asks for one.
    #
    # A request under /api/ ($api_request) gets the body the API sends for
    # the same status, so the UI presents it as any API problem; nginx sends
    # it with the status it rejected the request with, 494 as 400. For a 4xx
    # status, that is the body ProblemErrorController builds for a client
    # error: APP0400 at that status, with the status's reason phrase in lower
    # case as its argument, as the API answers a request Tomcat's connector
    # rejects. For 501 and 505 it is DEM9999 at that status, as in the gateway
    # bodies above. `title` is the reason phrase Spring gives the status, which
    # can differ from nginx's (413 Payload Too Large, 505 HTTP Version not
    # supported). `detail` is copied verbatim from
    # backend/customer-api/src/main/resources/messages/messages.properties
    # (APP0400 with its argument substituted, DEM9999) and must change
    # whenever that text does. `instance` again comes from
    # $api_problem_instance, so it is left out when nginx has no usable path,
    # as when it could not parse the request line or its URI. No errorId:
    # the API adds one only to a 500, whose ERROR log line it identifies.
    # NginxGatewayProblemTest (customer-api tests) compares every body with
    # ProblemFactory's output.
    #
    # Any other request keeps nginx's own HTML page: the `if` returns the
    # status without a body, and because this request has already been sent
    # to an error page, nginx answers its built-in page for that status
    # instead of looking up another (for 494, "400 Request Header Or Cookie
    # Too Large"). The empty `types` and default_type set the Content-Type as
    # in the gateway locations, and the error log is discarded, because the
    # request may be an API request whose line nginx would write into it.
    location = /_nginx/rejection/400 {
        internal;
        error_log /dev/null;
        types { }
        default_type application/problem+json;
        if ($api_request = "") {
            return 400;
        }
        return 400 '{"type":"urn:customer-master:problem:APP0400","title":"Bad Request","status":400,"detail":"Request is not valid: bad request",$api_problem_instance"code":"APP0400","args":["bad request"]}';
    }

    location = /_nginx/rejection/494 {
        internal;
        error_log /dev/null;
        types { }
        default_type application/problem+json;
        if ($api_request = "") {
            return 494;
        }
        return 400 '{"type":"urn:customer-master:problem:APP0400","title":"Bad Request","status":400,"detail":"Request is not valid: bad request",$api_problem_instance"code":"APP0400","args":["bad request"]}';
    }

    location = /_nginx/rejection/405 {
        internal;
        error_log /dev/null;
        types { }
        default_type application/problem+json;
        if ($api_request = "") {
            return 405;
        }
        return 405 '{"type":"urn:customer-master:problem:APP0400","title":"Method Not Allowed","status":405,"detail":"Request is not valid: method not allowed",$api_problem_instance"code":"APP0400","args":["method not allowed"]}';
    }

    location = /_nginx/rejection/413 {
        internal;
        error_log /dev/null;
        types { }
        default_type application/problem+json;
        if ($api_request = "") {
            return 413;
        }
        return 413 '{"type":"urn:customer-master:problem:APP0400","title":"Payload Too Large","status":413,"detail":"Request is not valid: payload too large",$api_problem_instance"code":"APP0400","args":["payload too large"]}';
    }

    location = /_nginx/rejection/414 {
        internal;
        error_log /dev/null;
        types { }
        default_type application/problem+json;
        if ($api_request = "") {
            return 414;
        }
        return 414 '{"type":"urn:customer-master:problem:APP0400","title":"URI Too Long","status":414,"detail":"Request is not valid: uri too long",$api_problem_instance"code":"APP0400","args":["uri too long"]}';
    }

    location = /_nginx/rejection/501 {
        internal;
        error_log /dev/null;
        types { }
        default_type application/problem+json;
        if ($api_request = "") {
            return 501;
        }
        return 501 '{"type":"urn:customer-master:problem:DEM9999","title":"Not Implemented","status":501,"detail":"Program Error! Please contact IT now.",$api_problem_instance"code":"DEM9999","args":[]}';
    }

    location = /_nginx/rejection/505 {
        internal;
        error_log /dev/null;
        types { }
        default_type application/problem+json;
        if ($api_request = "") {
            return 505;
        }
        return 505 '{"type":"urn:customer-master:problem:DEM9999","title":"HTTP Version not supported","status":505,"detail":"Program Error! Please contact IT now.",$api_problem_instance"code":"DEM9999","args":[]}';
    }

    # Single-page application: an existing file (index.html, hashed assets) is
    # served as is; any other path gets index.html, so client routes such as
    # /sign-in, /customers and /demo/selection load the app on a deep link or a
    # browser refresh.
    location / {
        try_files $uri /index.html;
    }
}
