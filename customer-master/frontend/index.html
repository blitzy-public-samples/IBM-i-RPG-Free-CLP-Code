      The empty data: URL icon is never fetched; without an icon link the
      browser requests /favicon.ico itself, which the Vite dev and preview
      servers answer with a 404 and a console error. The app ships no favicon
      file, so do not point this at a file unless one is added to the build.
      No skip link: React renders every screen, each opening with its own
      <main> landmark with no navigation block before it to bypass.
    -->
    <link rel="icon" href="data:," />
