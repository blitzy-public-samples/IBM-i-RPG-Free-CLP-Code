openapi: 3.1.0
info:
  title: Customer Master API
  version: "1"
servers:
- url: /
paths:
  /api/customers:
    get:
      operationId: searchCustomers
      parameters:
      - description: Name starts with (at most 13 characters)
        in: query
        name: name
        required: false
        schema:
          type: string
          maxLength: 13
          minLength: 0
      - description: City starts with (at most 13 characters)
        in: query
        name: city
        required: false
        schema:
          type: string
          maxLength: 13
          minLength: 0
      - description: Two-letter state code; blank = all
        in: query
        name: state
        required: false
        schema:
          type: string
      - description: Include inactive customers (F9)
        in: query
        name: includeInactive
        required: false
        schema:
          type: boolean
          default: false
      - description: "Page size 1–100, default 12"
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
      - description: Opaque cursor from nextCursor
        in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
          description: One page of matching customers
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "APP0400 (cursor, size, lengths) or DEM0007 (state)"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: APP0401
      security:
      - basicAuth: []
      summary: "Search customers by name, city and state"
      tags:
      - Customers
    post:
      operationId: addCustomer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerFields"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
          description: Created
          headers:
            Location:
              description: "Path of the new customer, /api/customers/{custId}"
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: APP0400
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: APP0401
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: APP0403
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: DEM1001
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "DEM0501, DEM0502, DEM0503"
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: APP0503
      security:
      - basicAuth: []
      summary: Add a customer under the next id
      tags:
      - Customers
  /api/customers/review:
    post:
      operationId: reviewCustomer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResponse"
          description: All rules passed; confirm with DEM0000 (EDIT) or DEM0009 (ADD)
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: APP0400
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: APP0401
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: APP0403
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "DEM0501, DEM0502, DEM0503, DEM9898 (stateAccepted when the\
            \ State rule passed)"
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: APP0502 (stateAccepted when the State rule passed)
      security:
      - basicAuth: []
      summary: Validate and standardize a customer before saving
      tags:
      - Customers
  /api/customers/{custId}:
    get:
      operationId: getCustomer
      parameters:
      - description: 4-character base-36 customer id
        in: path
        name: custId
        required: true
        schema:
          type: string
          pattern: "[A-Z0-9]{4}"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
          description: The stored customer
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: APP0400 (id format)
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: APP0401
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: DEM0599
      security:
      - basicAuth: []
      summary: Read one customer
      tags:
      - Customers
    put:
      operationId: updateCustomer
      parameters:
      - description: 4-character base-36 customer id
        in: path
        name: custId
        required: true
        schema:
          type: string
          pattern: "[A-Z0-9]{4}"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
          description: The stored customer with version + 1
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: APP0400 (including missing version)
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: APP0401
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: APP0403
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: DEM0599
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "DEM1002 with current, or DEM1001"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "DEM0501, DEM0502, DEM0503"
      security:
      - basicAuth: []
      summary: Change a customer at the version read
      tags:
      - Customers
  /api/messages:
    get:
      operationId: getMessages
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
          description: OK
      summary: Message catalog keyed by message id
      tags:
      - Messages
  /api/session:
    get:
      operationId: getSession
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: APP0401
      security:
      - basicAuth: []
      summary: Signed-in user and roles
      tags:
      - Session
  /api/states:
    get:
      operationId: listStates
      parameters:
      - description: "Case-insensitive name fragment, at most 10 characters"
        in: query
        name: nameContains
        required: false
        schema:
          type: string
          maxLength: 10
          minLength: 0
      - description: "Order of the list: by name (default) or by code"
        in: query
        name: sort
        required: false
        schema:
          type: string
          default: name
          enum:
          - name
          - code
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StateResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: APP0400
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: APP0401
      security:
      - basicAuth: []
      summary: "USA states, optionally filtered by name"
      tags:
      - States
components:
  schemas:
    CustomerFields:
      type: object
      properties:
        acctMgr:
          type: string
          maxLength: 40
          minLength: 0
        acctPhone:
          type: string
          maxLength: 20
          minLength: 0
        active:
          type: string
          maxLength: 1
          minLength: 0
        addr:
          type: string
          maxLength: 40
          minLength: 0
        city:
          type: string
          maxLength: 20
          minLength: 0
        corpPhone:
          type: string
          maxLength: 20
          minLength: 0
        name:
          type: string
          maxLength: 40
          minLength: 0
        state:
          type: string
          maxLength: 2
          minLength: 0
        zip:
          type: string
          maxLength: 10
          minLength: 0
    CustomerResponse:
      type: object
      properties:
        acctMgr:
          type: string
        acctPhone:
          type: string
        active:
          type: string
        addr:
          type: string
        chgTime:
          type: string
          format: date-time
        chgUser:
          type: string
        city:
          type: string
        corpPhone:
          type: string
        custId:
          type: string
        name:
          type: string
        state:
          type: string
        version:
          type: integer
          format: int64
        zip:
          type: string
    CustomerSummaryResponse:
      type: object
      properties:
        active:
          type: string
        city:
          type: string
        custId:
          type: string
        name:
          type: string
        state:
          type: string
        zip5:
          type: string
    CustomerUpdateRequest:
      type: object
      properties:
        acctMgr:
          type: string
          maxLength: 40
          minLength: 0
        acctPhone:
          type: string
          maxLength: 20
          minLength: 0
        active:
          type: string
          maxLength: 1
          minLength: 0
        addr:
          type: string
          maxLength: 40
          minLength: 0
        city:
          type: string
          maxLength: 20
          minLength: 0
        corpPhone:
          type: string
          maxLength: 20
          minLength: 0
        name:
          type: string
          maxLength: 40
          minLength: 0
        state:
          type: string
          maxLength: 2
          minLength: 0
        version:
          type: integer
          format: int64
        zip:
          type: string
          maxLength: 10
          minLength: 0
      required:
      - version
    Notice:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    ProblemDetail:
      type: object
      properties:
        detail:
          type:
          - string
          - "null"
        instance:
          type:
          - string
          - "null"
          format: uri
        properties:
          type:
          - object
          - "null"
          additionalProperties: {}
        status:
          type: integer
          format: int32
        title:
          type:
          - string
          - "null"
        type:
          type: string
          format: uri
    ReviewRequest:
      type: object
      properties:
        acctMgr:
          type: string
          maxLength: 40
          minLength: 0
        acctPhone:
          type: string
          maxLength: 20
          minLength: 0
        active:
          type: string
          maxLength: 1
          minLength: 0
        addr:
          type: string
          maxLength: 40
          minLength: 0
        city:
          type: string
          maxLength: 20
          minLength: 0
        corpPhone:
          type: string
          maxLength: 20
          minLength: 0
        name:
          type: string
          maxLength: 40
          minLength: 0
        purpose:
          type: string
          enum:
          - ADD
          - EDIT
        state:
          type: string
          maxLength: 2
          minLength: 0
        zip:
          type: string
          maxLength: 10
          minLength: 0
      required:
      - purpose
    ReviewResponse:
      type: object
      properties:
        customer:
          $ref: "#/components/schemas/CustomerFields"
        notice:
          $ref: "#/components/schemas/Notice"
        standardized:
          type: boolean
    SearchResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CustomerSummaryResponse"
        limitReached:
          type: boolean
        nextCursor:
          type: string
        notice:
          $ref: "#/components/schemas/Notice"
    SessionResponse:
      type: object
      properties:
        roles:
          type: array
          items:
            type: string
        username:
          type: string
    StateResponse:
      type: object
      properties:
        name:
          type: string
        state:
          type: string
  securitySchemes:
    basicAuth:
      scheme: basic
      type: http
