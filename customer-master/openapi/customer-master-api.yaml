openapi: 3.1.0
info:
  title: Customer Master API
  version: "1"
servers:
- url: /
paths:
  /api/customers:
    get:
      operationId: searchCustomers
      parameters:
      - description: Name starts with (at most 13 characters)
        in: query
        name: name
        required: false
        schema:
          type: string
          maxLength: 13
      - description: City starts with (at most 13 characters)
        in: query
        name: city
        required: false
        schema:
          type: string
          maxLength: 13
      - description: Two-letter state code; blank = all
        in: query
        name: state
        required: false
        schema:
          type: string
      - description: Include inactive customers (F9)
        in: query
        name: includeInactive
        required: false
        schema:
          type: boolean
          default: false
      - description: "Page size 1–100, default 12"
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 12
          maximum: 100
          minimum: 1
      - description: Opaque cursor from nextCursor
        in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
          description: One page of matching customers
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "APP0400 (cursor, size, lengths, U+0000) or DEM0007 (state)"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0401
        "405":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0400 (method not allowed; Allow lists the supported methods)
        "406":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0400 (not acceptable)
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: DEM9999 (unexpected failure; errorId matches the server's ERROR
            log line)
      security:
      - basicAuth: []
      summary: "Search customers by name, city and state"
      tags:
      - Customers
    post:
      operationId: addCustomer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerFields"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
          description: Created
          headers:
            Location:
              description: "Path of the new customer, /api/customers/{custId}"
              required: true
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0400
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0401
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0403
        "405":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0400 (method not allowed; Allow lists the supported methods)
        "406":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0400 (not acceptable)
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: DEM1001
        "415":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0400 (unsupported media type; Accept lists the supported
            type)
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "DEM0501, DEM0502, DEM0503"
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: DEM9999 (unexpected failure; errorId matches the server's ERROR
            log line)
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0503
      security:
      - basicAuth: []
      summary: Add a customer under the next id
      tags:
      - Customers
  /api/customers/review:
    post:
      operationId: reviewCustomer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResponse"
          description: All rules passed; confirm with DEM0000 (EDIT) or DEM0009 (ADD)
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0400
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0401
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0403
        "405":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0400 (method not allowed; Allow lists the supported methods)
        "406":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0400 (not acceptable)
        "415":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0400 (unsupported media type; Accept lists the supported
            type)
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "DEM0501, DEM0502, DEM0503, DEM9898; errors names the fields\
            \ at fault, and stateAccepted carries the normalized State when the State\
            \ rule passed"
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: DEM9999 (unexpected failure; errorId matches the server's ERROR
            log line)
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0502; stateAccepted carries the normalized State when the
            State rule passed
      security:
      - basicAuth: []
      summary: Validate and standardize a customer before saving
      tags:
      - Customers
  /api/customers/{custId}:
    get:
      operationId: getCustomer
      parameters:
      - description: 4-character base-36 customer id
        in: path
        name: custId
        required: true
        schema:
          type: string
          maxLength: 4
          minLength: 4
          pattern: "^[A-Z0-9]{4}$"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
          description: The stored customer
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0400 (id format)
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0401
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: DEM0599
        "405":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0400 (method not allowed; Allow lists the supported methods)
        "406":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0400 (not acceptable)
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: DEM9999 (unexpected failure; errorId matches the server's ERROR
            log line)
      security:
      - basicAuth: []
      summary: Read one customer
      tags:
      - Customers
    put:
      operationId: updateCustomer
      parameters:
      - description: 4-character base-36 customer id
        in: path
        name: custId
        required: true
        schema:
          type: string
          maxLength: 4
          minLength: 4
          pattern: "^[A-Z0-9]{4}$"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
          description: The stored customer with version + 1
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0400 (including missing version)
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0401
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0403
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: DEM0599
        "405":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0400 (method not allowed; Allow lists the supported methods)
        "406":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0400 (not acceptable)
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "DEM1002 (stale version), whose current carries the customer\
            \ as now stored, including its version; or DEM1001 (row locked), without\
            \ current"
        "415":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0400 (unsupported media type; Accept lists the supported
            type)
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "DEM0501, DEM0502, DEM0503"
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: DEM9999 (unexpected failure; errorId matches the server's ERROR
            log line)
      security:
      - basicAuth: []
      summary: Change a customer at the version read
      tags:
      - Customers
  /api/messages:
    get:
      operationId: getMessages
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0401 (only when invalid Basic credentials are supplied;
            an anonymous request is answered 200)
        "405":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0400 (method not allowed; Allow lists the supported methods)
        "406":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0400 (not acceptable)
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: DEM9999 (unexpected failure; errorId matches the server's ERROR
            log line)
      summary: Message catalog keyed by message id
      tags:
      - Messages
  /api/session:
    get:
      operationId: getSession
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0401
        "405":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0400 (method not allowed; Allow lists the supported methods)
        "406":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0400 (not acceptable)
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: DEM9999 (unexpected failure; errorId matches the server's ERROR
            log line)
      security:
      - basicAuth: []
      summary: Signed-in user and roles
      tags:
      - Session
  /api/states:
    get:
      operationId: listStates
      parameters:
      - description: "Case-insensitive name fragment, at most 10 characters"
        in: query
        name: nameContains
        required: false
        schema:
          type: string
          maxLength: 10
      - description: "Order of the list: by name (default) or by code"
        in: query
        name: sort
        required: false
        schema:
          type: string
          default: name
          enum:
          - name
          - code
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StateResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0400
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0401
        "405":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0400 (method not allowed; Allow lists the supported methods)
        "406":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: APP0400 (not acceptable)
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: DEM9999 (unexpected failure; errorId matches the server's ERROR
            log line)
      security:
      - basicAuth: []
      summary: "USA states, optionally filtered by name"
      tags:
      - States
components:
  schemas:
    CustomerFields:
      type: object
      additionalProperties: false
      properties:
        acctMgr:
          type:
          - string
          - "null"
          maxLength: 40
          minLength: 0
        acctPhone:
          type:
          - string
          - "null"
          maxLength: 20
          minLength: 0
        active:
          type:
          - string
          - "null"
          maxLength: 1
          minLength: 0
        addr:
          type:
          - string
          - "null"
          maxLength: 40
          minLength: 0
        city:
          type:
          - string
          - "null"
          maxLength: 20
          minLength: 0
        corpPhone:
          type:
          - string
          - "null"
          maxLength: 20
          minLength: 0
        name:
          type:
          - string
          - "null"
          maxLength: 40
          minLength: 0
        state:
          type:
          - string
          - "null"
          maxLength: 2
          minLength: 0
        zip:
          type:
          - string
          - "null"
          maxLength: 10
          minLength: 0
    CustomerResponse:
      type: object
      properties:
        acctMgr:
          type: string
        acctPhone:
          type: string
        active:
          type: string
        addr:
          type: string
        chgTime:
          type:
          - string
          - "null"
          format: date-time
        chgUser:
          type: string
        city:
          type: string
        corpPhone:
          type: string
        custId:
          type: string
        name:
          type: string
        state:
          type: string
        version:
          type: integer
          format: int64
        zip:
          type: string
      required:
      - acctMgr
      - acctPhone
      - active
      - addr
      - chgTime
      - chgUser
      - city
      - corpPhone
      - custId
      - name
      - state
      - version
      - zip
    CustomerSummaryResponse:
      type: object
      properties:
        active:
          type: string
        city:
          type: string
        custId:
          type: string
        name:
          type: string
        state:
          type: string
        zip5:
          type: string
      required:
      - active
      - city
      - custId
      - name
      - state
      - zip5
    CustomerUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        acctMgr:
          type:
          - string
          - "null"
          maxLength: 40
          minLength: 0
        acctPhone:
          type:
          - string
          - "null"
          maxLength: 20
          minLength: 0
        active:
          type:
          - string
          - "null"
          maxLength: 1
          minLength: 0
        addr:
          type:
          - string
          - "null"
          maxLength: 40
          minLength: 0
        city:
          type:
          - string
          - "null"
          maxLength: 20
          minLength: 0
        corpPhone:
          type:
          - string
          - "null"
          maxLength: 20
          minLength: 0
        name:
          type:
          - string
          - "null"
          maxLength: 40
          minLength: 0
        state:
          type:
          - string
          - "null"
          maxLength: 2
          minLength: 0
        version:
          type: integer
          format: int64
        zip:
          type:
          - string
          - "null"
          maxLength: 10
          minLength: 0
      required:
      - version
    FieldError:
      type: object
      description: One field at fault in a problem's errors
      properties:
        code:
          type: string
          description: The catalog key
          example: DEM0502
        field:
          type: string
          description: "The request body's JSON property (name, addr, city, state,\
            \ zip, corpPhone, acctMgr, acctPhone, active; version on update; purpose\
            \ on review) or the path or query parameter (custId; name, city, state,\
            \ includeInactive, size, cursor on search; nameContains, sort on the state\
            \ list) at fault"
          example: name
        message:
          type: string
          description: The catalog text with the arguments substituted
          example: "Name: Must not be blank"
      required:
      - code
      - field
      - message
    Notice:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
    Problem:
      type: object
      description: "RFC 9457 problem: the body of every error response. type, title,\
        \ status, detail, code and args are always present; the other members only\
        \ in the cases their descriptions name."
      properties:
        args:
          type: array
          description: "The values substituted into the catalog text, as strings;\
            \ empty when there are none"
          items:
            type: string
        code:
          type: string
          description: "The catalog key, for example APP0400, DEM0502 or DEM1002"
          example: DEM1002
        current:
          $ref: "#/components/schemas/CustomerResponse"
          description: "409 DEM1002 only: the customer as now stored, including its\
            \ version"
        detail:
          type: string
          description: The catalog text of code with args substituted
          example: Someone else changed record. Review data.
        errorId:
          type: string
          format: uuid
          description: "500 DEM9999 only: the correlation id, also written to the\
            \ server's ERROR log line"
        errors:
          type: array
          description: "The fields at fault; the first entry receives focus. Present\
            \ when the failure names a request property or parameter: 400 APP0400\
            \ on a body property or a path or query parameter, 400 DEM0007 on state,\
            \ 422 DEM0501, DEM0502 or DEM0503 on the field whose rule failed, and\
            \ 422 DEM9898 on addr, city, state and zip, in that order. Absent when\
            \ it names none, as for a malformed body, an unknown property, content\
            \ after the JSON value, an unknown route, 405, 406, 415, 401, 403, 404\
            \ DEM0599, 409, 502, 503 and 500"
          items:
            $ref: "#/components/schemas/FieldError"
          minItems: 1
        instance:
          type: string
          format: uri-reference
          description: The request path; absent only when the path is not a usable
            URI reference
          example: /api/customers/EEEF
        stateAccepted:
          type: string
          description: "Failures of POST /api/customers/review only (422 and 502):\
            \ the normalized State, present when the State rule passed before the\
            \ failure and absent when the failure is at the State rule or before it"
          example: ME
        status:
          type: integer
          format: int32
          description: The HTTP status of the response
          example: 409
        title:
          type: string
          description: The HTTP reason phrase of status
          example: Conflict
        type:
          type: string
          format: uri
          description: "urn:customer-master:problem: followed by the catalog key"
          example: urn:customer-master:problem:DEM1002
      required:
      - args
      - code
      - detail
      - status
      - title
      - type
    ReviewRequest:
      type: object
      additionalProperties: false
      properties:
        acctMgr:
          type:
          - string
          - "null"
          maxLength: 40
          minLength: 0
        acctPhone:
          type:
          - string
          - "null"
          maxLength: 20
          minLength: 0
        active:
          type:
          - string
          - "null"
          maxLength: 1
          minLength: 0
        addr:
          type:
          - string
          - "null"
          maxLength: 40
          minLength: 0
        city:
          type:
          - string
          - "null"
          maxLength: 20
          minLength: 0
        corpPhone:
          type:
          - string
          - "null"
          maxLength: 20
          minLength: 0
        name:
          type:
          - string
          - "null"
          maxLength: 40
          minLength: 0
        purpose:
          type: string
          enum:
          - ADD
          - EDIT
        state:
          type:
          - string
          - "null"
          maxLength: 2
          minLength: 0
        zip:
          type:
          - string
          - "null"
          maxLength: 10
          minLength: 0
      required:
      - purpose
    ReviewResponse:
      type: object
      properties:
        customer:
          allOf:
          - $ref: "#/components/schemas/CustomerFields"
          required:
          - acctMgr
          - acctPhone
          - active
          - addr
          - city
          - corpPhone
          - name
          - state
          - zip
        notice:
          $ref: "#/components/schemas/Notice"
        standardized:
          type: boolean
      required:
      - customer
      - notice
      - standardized
    SearchResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CustomerSummaryResponse"
        limitReached:
          type: boolean
        nextCursor:
          type:
          - string
          - "null"
        notice:
          oneOf:
          - $ref: "#/components/schemas/Notice"
          - type: "null"
      required:
      - items
      - limitReached
      - nextCursor
      - notice
    SessionResponse:
      type: object
      properties:
        roles:
          type: array
          items:
            type: string
            enum:
            - INQUIRY
            - MAINTENANCE
        username:
          type: string
      required:
      - roles
      - username
    StateResponse:
      type: object
      properties:
        name:
          type: string
        state:
          type: string
      required:
      - name
      - state
  securitySchemes:
    basicAuth:
      scheme: basic
      type: http
